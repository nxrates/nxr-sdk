[package]
name = "nxr-sdk-python"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Python bindings for the NX Rates SDK (MITCH decode, multicast subscriber, REST client)"
repository = "https://github.com/nxrates/nxr-sdk"
keywords = ["finance", "market-data", "mitch", "hft", "python"]

# pyo3 produces a C extension (cdylib). `lib` retained so `cargo check`
# can also exercise the Rust internals without going through maturin.
[lib]
name = "nxr_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical Rust SDK provides MITCH types, IPC primitives, ticker resolve,
# synth composition. Re-exported through this thin pyo3 wrapper.
nxr-sdk = { path = "../rust", default-features = false }

# MITCH protocol crate (path-dep matches sdk/rust layout).
mitch = { path = "../../mitch/impl/rust", features = ["bytemuck"] }

# pyo3 0.22 — modern Bound<PyType> API. abi3-py39 produces a single wheel
# that runs on every CPython >= 3.9.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# NumPy buffer protocol (structured arrays + zero-copy borrows).
numpy = "0.22"

# Zero-copy slab casts: borrow a Vec<u8> as &[IndexRecord] / &[Bar].
bytemuck = { version = "1", features = ["derive"] }

# Tokio runtime for the async UDP multicast subscriber. `net` for UdpSocket;
# `rt-multi-thread` lets pyo3-async-runtimes spawn a background reactor.
tokio = { version = "1", features = ["rt-multi-thread", "rt", "net", "sync", "macros", "time"] }

# socket2 for SO_REUSEADDR / SO_RCVBUF / join_multicast on the receiver.
# Mirrors the tuning sdk/rust/src/transport.rs applies.
socket2 = { version = "0.5", features = ["all"] }

# Blocking HTTP client for the historical-batch fetcher. `blocking` avoids
# forcing every caller into pyo3-async-runtimes.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
