[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "nxr-sdk"
version = "0.2.0"
description = "NX Rates Python SDK — pyo3-backed MITCH decoder, multicast subscriber, REST client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "NX Rates" }]
keywords = ["finance", "market-data", "mitch", "hft", "quant"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy >= 1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "maturin>=1.5"]

[tool.maturin]
# Native extension lives under python/nxr_sdk/_native.* alongside a thin
# Python facade that re-exports the symbols.
module-name = "nxr_sdk._native"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
