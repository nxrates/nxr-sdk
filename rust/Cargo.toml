[package]
name = "nxr-sdk"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "NX Rates SDK - MITCH types, IPC primitives, aggregation, resolution, config, and consumer client (REST/WebSocket/UDP multicast)"
repository = "https://github.com/nxrates/nxr-sdk"
keywords = ["finance", "market-data", "mitch", "hft"]

[features]
default = []
# UDP multicast + publisher traits (nxr core aggregator / bar multicast).
transport = ["dep:socket2", "tokio/net"]
# REST + binary WS consumer client.
client = ["transport", "dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util"]
# Shared axum `/metrics` server (crypto/fx forwarder bins).
server-metrics = ["dep:axum", "dep:metrics", "dep:metrics-exporter-prometheus", "tokio/net"]

[dependencies]
mitch = { path = "../../mitch/impl/rust", features = ["bytemuck"] }

bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"

tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
bytes = "1"
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"], optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

anyhow = "1"
futures-util = { version = "0.3", features = ["sink"], optional = true }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

dashmap = "6"
flate2 = "1"

chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

socket2 = { version = "0.5", features = ["all"], optional = true }
libc = "0.2"
fs2 = "0.4"
coarsetime = "0.1"

metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", default-features = false, optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
ureq = { version = "2.10", features = ["json"] }
wiremock = "0.6"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "fetch_demo"
required-features = ["client"]

[[example]]
name = "plan_aware"
required-features = ["client"]

[[example]]
name = "quickstart"
required-features = ["client"]

[[test]]
name = "client_tests"
required-features = ["client"]
